<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#6d2434">
  <title>التحفيظ — المشغل</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/player.css">
</head>
<body>
  <main class="player-shell">
    <header class="player-header">
      <button id="backBtn" class="icon-btn" title="الإعدادات">⚙️</button>
      <div>
        <div id="playerSurah" class="eyebrow"></div>
        <h1>جلسة التحفيظ</h1>
      </div>
      <div class="mode-badge" id="modeBadge">عادي</div>
    </header>

    <section class="ayah-card">
      <div class="ayah-meta">
        <span id="ayahCounter">الآية 1</span>
        <span id="ayahNumber" class="ayah-number">١</span>
      </div>
      <div id="ayahText" class="ayah-text">نص الآية سيظهر هنا</div>
    </section>

    <section class="progress-card">
      <div class="progress-head">
        <strong>📜 تكرار الآية</strong>
        <span id="ayahRepeatLabel">1 / 1</span>
      </div>
      <div class="game-bar"><div id="ayahBar" class="game-fill"></div></div>

      <div class="progress-head paragraph-head">
        <strong>🏆 تكرار الفقرة</strong>
        <span id="paragraphRepeatLabel">1 / 1</span>
      </div>
      <div class="game-bar paragraph-bar"><div id="paragraphBar" class="game-fill"></div></div>
    </section>

    <section class="controls">
      <button id="prevBtn" class="control-btn">⏮️<small>السابق</small></button>
      <button id="playPauseBtn" class="play-btn">▶️</button>
      <button id="nextBtn" class="control-btn">⏭️<small>التالي</small></button>
    </section>

    <section class="secondary-controls">
      <button id="repeatParagraphBtn" class="secondary-btn">🔄 من بداية الفقرة</button>
      <button id="hardStopBtn" class="stop-btn">🛑 إيقاف دائم</button>
    </section>

    <div id="status" class="status">جاهز للبدء</div>

    <audio id="teacherAudio" preload="auto"></audio>
    <audio id="childAudio" preload="auto"></audio>
  </main>

  <script src="data/surahs.js"></script>
  <script src="data/reciters.js"></script>
  <script src="data/pause-points.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
