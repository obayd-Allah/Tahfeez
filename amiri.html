
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار خط أميري قرآن</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    background: #f5f3ec;
    color: #222;
    font-family: sans-serif;
}

header {
    max-width: 900px;
    margin: 0 auto 20px;
    padding: 20px 12px;
    text-align: center;
    background: white;
    border: 1px solid #e1dccf;
    border-radius: 12px;
}

h1 {
    margin: 0 0 8px;
    font-size: 24px;
}

.subtitle {
    color: #666;
    margin: 0;
}

.surah {
    max-width: 900px;
    margin: auto;
    padding: 18px;
    background: #fffefa;
    border: 1px solid #ded8c9;
    border-radius: 12px;
}

.surah-title {
    text-align: center;
    margin: 0 0 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid #ded8c9;
    font-size: 25px;
}

.ayah {
    padding: 15px 4px;
    border-bottom: 1px solid #eee9df;
}

.ayah:last-child {
    border-bottom: 0;
}

.ayah-number {
    display: block;
    margin-bottom: 5px;
    color: #777;
    font: 13px sans-serif;
}

.quran {
    font-family: "Amiri Quran", serif;
    font-size: 30px;
    line-height: 2.2;
    text-align: justify;
    text-align-last: right;
    overflow-wrap: anywhere;
}

.status {
    max-width: 900px;
    margin: 14px auto;
    padding: 12px;
    background: white;
    border-radius: 8px;
    font-size: 14px;
    text-align: center;
}

@media (max-width: 480px) {
    body {
        padding: 8px;
    }

    .surah {
        padding: 12px;
    }

    .quran {
        font-size: 27px;
        line-height: 2.15;
    }
}
</style>
</head>

<body>

<header>
    <h1>اختبار خط Amiri Quran</h1>
    <p class="subtitle">سورة الإسراء — الآيات ١ إلى ١٦</p>
</header>

<div class="status" id="fontStatus">
    جارٍ تحميل الخط...
</div>

<main class="surah">
    <h2 class="surah-title">سُبْحَانَ الَّذِي أَسْرَىٰ</h2>
    <div id="ayahs"></div>
</main>

<script>
const ayahs = [
"سُبۡحَٰنَ ٱلَّذِيٓ أَسۡرَىٰ بِعَبۡدِهِۦ لَيۡلࣰا مِّنَ ٱلۡمَسۡجِدِ ٱلۡحَرَامِ إِلَى ٱلۡمَسۡجِدِ ٱلۡأَقۡصَا ٱلَّذِي بَٰرَكۡنَا حَوۡلَهُۥ لِنُرِيَهُۥ مِنۡ ءَايَٰتِنَآۚ إِنَّهُۥ هُوَ ٱلسَّمِيعُ ٱلۡبَصِيرُ ۝١",

"وَءَاتَيۡنَا مُوسَى ٱلۡكِتَٰبَ وَجَعَلۡنَٰهُ هُدࣰى لِّبَنِيٓ إِسۡرَٰٓءِيلَ أَلَّا تَتَّخِذُواْ مِن دُونِي وَكِيلࣰا ۝٢",

"ذُرِّيَّةَ مَنۡ حَمَلۡنَا مَعَ نُوحٍۚ إِنَّهُۥ كَانَ عَبۡدࣰا شَكُورࣰا ۝٣",

"وَقَضَيۡنَآ إِلَىٰ بَنِيٓ إِسۡرَٰٓءِيلَ فِي ٱلۡكِتَٰبِ لَتُفۡسِدُنَّ فِي ٱلۡأَرۡضِ مَرَّتَيۡنِ وَلَتَعۡلُنَّ عُلُوࣰّا كَبِيرࣰا ۝٤",

"فَإِذَا جَآءَ وَعۡدُ أُولَىٰهُمَا بَعَثۡنَا عَلَيۡكُمۡ عِبَادࣰا لَّنَآ أُوْلِي بَأۡسࣲ شَدِيدࣲ فَجَاسُواْ خِلَٰلَ ٱلدِّيَارِۚ وَكَانَ وَعۡدࣰا مَّفۡعُولࣰا ۝٥",

"ثُمَّ رَدَدۡنَا لَكُمُ ٱلۡكَرَّةَ عَلَيۡهِمۡ وَأَمۡدَدۡنَٰكُم بِأَمۡوَٰلࣲ وَبَنِينَ وَجَعَلۡنَٰكُمۡ أَكۡثَرَ نَفِيرًا ۝٦",

"إِنۡ أَحۡسَنتُمۡ أَحۡسَنتُمۡ لِأَنفُسِكُمۡۖ وَإِنۡ أَسَأۡتُمۡ فَلَهَاۚ فَإِذَا جَآءَ وَعۡدُ ٱلۡأٓخِرَةِ لِيَسُـُٔواْ وُجُوهَكُمۡ وَلِيَدۡخُلُواْ ٱلۡمَسۡجِدَ كَمَا دَخَلُوهُ أَوَّلَ مَرَّةࣲ وَلِيُتَبِّرُواْ مَا عَلَوۡاْ تَتۡبِيرًا ۝٧",

"عَسَىٰ رَبُّكُمۡ أَن يَرۡحَمَكُمۡۚ وَإِنۡ عُدتُّمۡ عُدۡنَاۚ وَجَعَلۡنَا جَهَنَّمَ لِلۡكَٰفِرِينَ حَصِيرًا ۝٨",

"إِنَّ هَٰذَا ٱلۡقُرۡءَانَ يَهۡدِي لِلَّتِي هِيَ أَقۡوَمُ وَيُبَشِّرُ ٱلۡمُؤۡمِنِينَ ٱلَّذِينَ يَعۡمَلُونَ ٱلصَّٰلِحَٰتِ أَنَّ لَهُمۡ أَجۡرࣰا كَبِيرࣰا ۝٩",

"وَأَنَّ ٱلَّذِينَ لَا يُؤۡمِنُونَ بِٱلۡأٓخِرَةِ أَعۡتَدۡنَا لَهُمۡ عَذَابًا أَلِيمࣰا ۝١٠",

"وَيَدۡعُ ٱلۡإِنسَٰنُ بِٱلشَّرِّ دُعَآءَهُۥ بِٱلۡخَيۡرِۖ وَكَانَ ٱلۡإِنسَٰنُ عَجُولࣰا ۝١١",

"وَجَعَلۡنَا ٱلَّيۡلَ وَٱلنَّهَارَ ءَايَتَيۡنِۖ فَمَحَوۡنَآ ءَايَةَ ٱلَّيۡلِ وَجَعَلۡنَآ ءَايَةَ ٱلنَّهَارِ مُبۡصِرَةࣰ لِّتَبۡتَغُواْ فَضۡلࣰا مِّن رَّبِّكُمۡ وَلِتَعۡلَمُواْ عَدَدَ ٱلسِّنِينَ وَٱلۡحِسَابَۚ وَكُلَّ شَيۡءࣲ فَصَّلۡنَٰهُ تَفۡصِيلࣰا ۝١٢",

"وَكُلَّ إِنسَٰنٍ أَلۡزَمۡنَٰهُ طَٰٓئِرَهُۥ فِي عُنُقِهِۦۖ وَنُخۡرِجُ لَهُۥ يَوۡمَ ٱلۡقِيَٰمَةِ كِتَٰبࣰا يَلۡقَىٰهُ مَنشُورًا ۝١٣",

"ٱقۡرَأۡ كِتَٰبَكَ كَفَىٰ بِنَفۡسِكَ ٱلۡيَوۡمَ عَلَيۡكَ حَسِيبࣰا ۝١٤",

"مَّنِ ٱهۡتَدَىٰ فَإِنَّمَا يَهۡتَدِي لِنَفۡسِهِۦۖ وَمَن ضَلَّ فَإِنَّمَا يَضِلُّ عَلَيۡهَاۚ وَلَا تَزِرُ وَازِرَةࣱ وِزۡرَ أُخۡرَىٰۗ وَمَا كُنَّا مُعَذِّبِينَ حَتَّىٰ نَبۡعَثَ رَسُولࣰا ۝١٥",

"وَإِذَآ أَرَدۡنَآ أَن نُّهۡلِكَ قَرۡيَةً أَمَرۡنَا مُتۡرَفِيهَا فَفَسَقُواْ فِيهَا فَحَقَّ عَلَيۡهَا ٱلۡقَوۡلُ فَدَمَّرۡنَٰهَا تَدۡمِيرࣰا ۝١٦"
];

const container = document.getElementById("ayahs");

ayahs.forEach((text, index) => {
    const article = document.createElement("article");
    article.className = "ayah";

    const number = document.createElement("span");
    number.className = "ayah-number";
    number.textContent = "الآية " + (index + 1);

    const verse = document.createElement("div");
    verse.className = "quran";
    verse.textContent = text;

    article.append(number, verse);
    container.appendChild(article);
});

document.fonts.ready.then(() => {
    const loaded = document.fonts.check('30px "Amiri Quran"');
    document.getElementById("fontStatus").textContent =
        loaded
        ? "تم تحميل الخط. افحص مواضع الحركات والعلامات بنفسك."
        : "تعذر تأكيد تحميل الخط؛ تحقق من اتصال الإنترنت.";
});
</script>

</body>
</html>
